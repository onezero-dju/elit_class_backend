<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web IDE Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.1/ace.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: monospace;
            background-color: #1e1e1e;
            color: white;
        }

        #topbar {
            background-color: #333;
            padding: 10px;
        }

        #workspace {
            display: flex;
            height: calc(100vh - 40px);
        }

        #file-tree {
            width: 250px;
            background-color: #2e2e2e;
            padding: 10px;
            overflow-y: auto;
        }

        #editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            height: 100%;
        }

        .file, .folder {
            margin: 5px 0;
            cursor: pointer;
        }

        .folder {
            font-weight: bold;
        }

        .selected {
            background-color: #555;
        }

        input, button {
            font-family: monospace;
            margin: 2px;
        }
    </style>
</head>
<body>
<div id="topbar">
    📦 Container ID: <input type="text" id="containerIdInput" placeholder="컨테이너 ID" />
    📁 Project Name: <input type="text" id="projectNameInput" placeholder="프로젝트 이름" />
    <button onclick="sendToServer()">🚀 업로드</button>
</div>

<div id="workspace">
    <div id="file-tree"></div>
    <div id="editor-container">
        <div id="editor">/* 파일을 선택해주세요 */</div>
    </div>
</div>

<script>
    const editor = ace.edit("editor");
    editor.setTheme("ace/theme/monokai");
    editor.session.setMode("ace/mode/java");

    let root = {
        name: "project-root",
        type: "folder",
        children: []
    };
    let selectedFile = null;

    function renderTree() {
        const tree = document.getElementById("file-tree");
        tree.innerHTML = '';
        appendNode(root, tree);
    }

    function appendNode(node, parentElement) {
        const nodeElem = document.createElement("div");
        nodeElem.className = node.type;
        nodeElem.textContent = node.name;

        nodeElem.onclick = (e) => {
            e.stopPropagation();
            if (node.type === "file") {
                if (selectedFile) selectedFile.elem.classList.remove("selected");
                selectedFile = { node, elem: nodeElem };
                nodeElem.classList.add("selected");
                editor.setValue(node.content || "", -1);
            }
        };

        const actions = document.createElement("div");
        if (node.type === "folder") {
            const addFileBtn = document.createElement("button");
            addFileBtn.textContent = "+F";
            addFileBtn.onclick = () => {
                const name = prompt("파일명:");
                if (name) {
                    node.children.push({ name, type: "file", content: "" });
                    renderTree();
                }
            };
            const addFolderBtn = document.createElement("button");
            addFolderBtn.textContent = "+D";
            addFolderBtn.onclick = () => {
                const name = prompt("폴더명:");
                if (name) {
                    node.children.push({ name, type: "folder", children: [] });
                    renderTree();
                }
            };
            actions.append(addFileBtn, addFolderBtn);
        }
        nodeElem.appendChild(actions);
        parentElement.appendChild(nodeElem);

        if (node.type === "folder" && node.children) {
            const subTree = document.createElement("div");
            subTree.style.marginLeft = "15px";
            node.children.forEach(child => appendNode(child, subTree));
            parentElement.appendChild(subTree);
        }
    }

    function sendToServer() {
        if (selectedFile) {
            selectedFile.node.content = editor.getValue();
        }

        const containerId = document.getElementById("containerIdInput").value.trim();
        const projectName = document.getElementById("projectNameInput").value.trim();
        if (!containerId || !projectName) return alert("Container ID와 프로젝트명을 입력하세요.");

        const payload = {
            container_id: containerId,
            project_name: projectName,
            files: root
        };

        fetch("http://localhost:8080/ide/down-file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(res => alert("✅ 업로드 완료"))
            .catch(err => alert("❌ 실패: " + err));
    }

    renderTree();
</script>
</body>
</html>
