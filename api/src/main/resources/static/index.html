<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Web IDE Tree</title>
    <style>
        ul { list-style-type: none; }
        li { margin-left: 20px; }
        button { margin: 2px; }
        input[type="text"] { width: 150px; }
    </style>
</head>
<body>
<h2>🌲 Web IDE - 파일 트리 구성</h2>

<label>📦 Container ID: <input type="text" id="containerIdInput" placeholder="컨테이너 ID 입력"></label><br>
<label>📁 Project Name: <input type="text" id="projectNameInput" placeholder="프로젝트 이름 입력"></label><br><br>

<ul id="tree-root"></ul>
<button onclick="submitTree()">📤 서버로 전송</button>

<script>
    let rootNode = {
        name: "project-root",
        type: "folder",
        children: []
    };

    function createNodeElement(node, parentUl) {
        const li = document.createElement("li");
        li.textContent = node.name + (node.type === 'folder' ? '/' : '');

        if (node.type === 'file') {
            const editBtn = document.createElement("button");
            editBtn.textContent = "✏️";
            editBtn.onclick = () => {
                const content = prompt("파일 내용:", node.content || "");
                if (content !== null) node.content = content;
            };
            li.appendChild(editBtn);
        }

        const addFileBtn = document.createElement("button");
        addFileBtn.textContent = "+ 파일";
        addFileBtn.onclick = () => {
            const name = prompt("파일명:");
            if (name) {
                const newFile = { name, type: "file", content: "" };
                if (!node.children) node.children = [];
                node.children.push(newFile);
                renderTree();
            }
        };

        const addFolderBtn = document.createElement("button");
        addFolderBtn.textContent = "+ 폴더";
        addFolderBtn.onclick = () => {
            const name = prompt("폴더명:");
            if (name) {
                const newFolder = { name, type: "folder", children: [] };
                if (!node.children) node.children = [];
                node.children.push(newFolder);
                renderTree();
            }
        };

        li.appendChild(addFileBtn);
        li.appendChild(addFolderBtn);
        parentUl.appendChild(li);

        if (node.children && node.children.length > 0) {
            const subUl = document.createElement("ul");
            node.children.forEach(child => createNodeElement(child, subUl));
            li.appendChild(subUl);
        }
    }

    function renderTree() {
        const tree = document.getElementById("tree-root");
        tree.innerHTML = "";
        createNodeElement(rootNode, tree);
    }

    function submitTree() {
        const containerId = document.getElementById("containerIdInput").value.trim();
        const projectName = document.getElementById("projectNameInput").value.trim();

        if (!containerId || !projectName) {
            alert("Container ID와 Project Name을 입력해주세요.");
            return;
        }

        const requestPayload = {
            container_id : containerId,
            project_name: projectName,
            files: rootNode
        };

        fetch("http://localhost:8080/ide/down-file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestPayload)
        })
            .then(res => res.json())
            .then(data => alert("서버 응답: " + JSON.stringify(data)))
            .catch(err => alert("에러 발생: " + err));
    }

    renderTree();
</script>
</body>
</html>
